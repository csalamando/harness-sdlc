# Matriz de autoridad — qué rol es DUEÑO de cada artefacto de la spec.
# Un solo owner por artefacto. Emitir/firmar un artefacto sin ser su owner
# bloquea el gate (receipt.py emit --role valida contra esta matriz).
# Cambiar esta matriz es un cambio de gobierno: requiere PR y queda auditado.
#
# Opinar no es poseer: cualquier rol participa vía Advice Process (Paso 5);
# la matriz solo restringe la AUTORÍA y la EMISIÓN del recibo.

artifacts:
  # Fase 0 — Discovery
  - path: spec/vision.md
    owner: product-owner
  - path: spec/epics.md
    owner: product-owner
  - path: spec/backlog.md
    owner: product-owner
  - path: spec/architecture-proposal.md
    owner: solution-architect
  - path: spec/technical-stories.md
    owner: solution-architect
  - path: spec/cost-assumptions.yaml
    owner: cloud-pricing
  - path: spec/cost-estimation.md
    owner: cloud-pricing

  # Fase 1 — Análisis
  - path: spec/user-stories.md
    owner: business-analyst
  - path: spec/business-rules.md
    owner: business-analyst
  - path: spec/glossary.md
    owner: business-analyst
  - path: spec/roles.md
    owner: business-analyst   # catálogo de roles gobernado (v2.7): nombre + acciones + contexto + restricciones
  - path: spec/process-definition.md
    owner: business-analyst   # PDD AS-IS (v2.7, condicional: automatización/rediseño de procesos)

  # Fase 2 — Diseño
  - path: spec/ux-flows.md
    owner: ux-designer
  - path: spec/design-system.md
    owner: ux-designer
  - path: spec/tokens.json
    owner: ux-designer   # design tokens consumidos por el frontend
  - path: spec/ux/
    owner: ux-designer   # prototipo gobernado (v2.8, condicional a UI): inventario PANT-xx + archivo .penpot + exports
  - path: spec/architecture.md
    owner: software-architect
  - path: spec/api-contract.yaml
    owner: software-architect
  - path: spec/data-model.md
    owner: software-architect
  - path: spec/adr/
    owner: software-architect   # único que firma ADRs
  - path: spec/test-plan.md
    owner: software-architect
  - path: spec/architecture-rules.yaml
    owner: software-architect   # invariantes por capas ejecutables (v2.21, arch_lint.py); cambio = decisión de arquitectura
  - path: spec/tech-debt.md
    owner: software-architect
  - path: spec/threat-model.md
    owner: security-engineer
  - path: spec/security-requirements.md
    owner: security-engineer
  - path: spec/data-governance.md
    owner: data-engineer
  - path: spec/tech-radar.yaml
    owner: enterprise-architect
  - path: spec/architectural-principles.yaml
    owner: enterprise-architect
  - path: spec/exception-log.md
    owner: enterprise-architect   # ADRs de excepción al radar

  # Fase 4 — Construcción (v2.29: traza de entregables de los skills dev)
  - path: spec/dev-log-backend.md
    owner: backend-dev      # por HU: tests Red primero, commits, cobertura, contrato verificado
  - path: spec/dev-log-frontend.md
    owner: frontend-dev     # por HU: mocks MSW del contrato, tests de componente, pantallas

  # Historias técnicas en 2 niveles (v2.30)
  # Nivel 0 (decisión de iniciativa): spec/technical-stories.md → solution-architect (GATE 0, arriba)
  - path: spec/technical-design.md
    owner: software-architect   # Nivel 1 ALTO NIVEL (Fase 2-3): historias técnicas de construcción derivadas de architecture.md/api-contract/data-model; las genera y aprueba el arquitecto
  - path: spec/technical-design-backend.md
    owner: backend-dev          # Nivel 2 DETALLE (Fase 4): diseño detallado por HU antes de codificar; alimenta dev-log-backend
  - path: spec/technical-design-frontend.md
    owner: frontend-dev         # Nivel 2 DETALLE (Fase 4): diseño detallado por HU/pantalla; alimenta dev-log-frontend

  # Fase 5-7 — Entrega y operación
  - path: spec/qa-report.md
    owner: qa-automation
  - path: spec/cloud-costs.md
    owner: cloud-engineer
  - path: spec/slo.md
    owner: sre
  - path: spec/impact-report.md
    owner: product-analyst
  - path: spec/runbook-deploy-rollback.md
    owner: devops-engineer    # v2.29: los runbooks/checklists de despliegue tienen dueño
  - path: spec/checklist-validacion-dev.md
    owner: devops-engineer    # v2.29
  - path: spec/docs/
    owner: technical-writer   # v2.29: guías de usuario/desarrollador doc-as-code

  # Diagramas (v2.6) — mecanismo de aceptación de cambios
  - path: spec/diagrams/despliegue.ir.json
    owner: cloud-engineer     # IR interactivo (v2.20); el HTML es vista derivada
  - path: spec/diagrams/pipeline-cicd.md
    owner: devops-engineer    # derivado de .github/workflows/; nunca editado a mano
  # Nota: los diagramas de diseño (C4, BPMN, secuencia, Gantt) no se listan
  # por archivo: los aprueba el rol dueño del artefacto que representan
  # (C4 → software-architect, BPMN → business-analyst, Gantt → product-owner).

  # Gobierno (cambiar la matriz misma)
  - path: spec/authority-matrix.yaml
    owner: orchestrator
  - path: spec/team-roster.yaml
    owner: orchestrator
  - path: spec/risk-tier.yaml
    owner: orchestrator
  - path: spec/dashboard.html
    owner: orchestrator   # dashboard vivo (v2.12, ADR-002): derivado de recibos + sprint reviews; nunca editado a mano
  # Telemetría gobernada (v2.15): la evidencia del proceso se edita por script, no a mano
  - path: spec/METRICS.md
    owner: orchestrator   # tablero vivo; lo regenera skill_metrics.py report / sprint_review.py
  - path: spec/metrics/
    owner: orchestrator   # usage.jsonl append-only (activaciones de skills)
  - path: spec/reports/
    owner: orchestrator   # sprint-review-NN.md: snapshot de cierre; requiere gate sprint-review + recibo
  - path: spec/audit/
    owner: orchestrator   # memoria de auditoría (v2.21, ADR-004): append-only con cadena de hash; se escribe SOLO por scripts del arnés
  - path: spec/pipeline-state.md
    owner: orchestrator   # DERIVADO (v2.22, N7): lo regenera pipeline_state.py desde recibos + auditoría; nunca editado a mano ni con recibo
