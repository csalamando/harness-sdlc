# Workflow de CI: autoridad + gates de spec en cada PR que toque spec/.
# Guardar como .github/workflows/spec-governance.yml
# Requiere las skills del arnés en el repo (p. ej. .claude/skills/sdlc-orchestrator).

name: spec-governance
on:
  pull_request:
    paths: ["spec/**"]
  push:
    branches: [main]
    paths: ["spec/**"]

jobs:
  authority-and-gates:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Autoridad — cada archivo spec/ modificado lo toca su rol dueño
        run: |
          ORCH=.claude/skills/sdlc-orchestrator/scripts
          FAILED=0
          for f in $(git diff --name-only origin/${{ github.base_ref }}...HEAD -- spec/ | grep -v spec/receipts/); do
            # Mapear autor del commit al rol esperado vía CODEOWNERS/matriz del equipo
            python3 $ORCH/authority_check.py "$f" --author "${{ github.actor }}" \
              --map spec/authority-matrix.yaml --team spec/team-roster.yaml || FAILED=1
          done
          exit $FAILED

      - name: Gates — artefactos modificados pasan su checklist y su recibo está vigente
        run: |
          ORCH=.claude/skills/sdlc-orchestrator/scripts
          FAILED=0
          for f in $(git diff --name-only origin/${{ github.base_ref }}...HEAD -- spec/); do
            case "$f" in
              spec/user-stories.md)            T=user-stories ;;
              spec/architecture-proposal.md)   T=architecture-proposal ;;
              spec/technical-stories.md)       T=technical-stories ;;
              spec/cost-estimation.md)         T=cost-estimation ;;
              spec/architecture.md)            T=architecture ;;
              spec/api-contract.yaml)          T=api-contract ;;
              spec/test-plan.md)               T=test-plan ;;
              spec/threat-model.md)            T=threat-model ;;
              spec/qa-report.md)               T=qa-report ;;
              spec/slo.md)                     T=slo ;;
              spec/adr/*.md)                   T=adr ;;
              spec/reports/*.md)               T=sprint-review ;;
              *) continue ;;
            esac
            python3 $ORCH/gate_checker.py "$f" --tipo $T || FAILED=1
          done
          exit $FAILED

      - name: Dashboard — frescura del grafo (visible, no bloqueante)
        continue-on-error: true
        run: |
          ORCH=.claude/skills/sdlc-orchestrator/scripts
          python3 $ORCH/harness_graph.py --proyecto . --check \
            || echo "::warning::spec/dashboard.html está desactualizado — regenerar con harness_graph.py --proyecto ."

      - name: TDD — orden de commits test→código por HU (warning)
        continue-on-error: true
        run: |
          python3 .claude/skills/sdlc-orchestrator/scripts/tdd_order_check.py \
            --range origin/${{ github.base_ref }}...HEAD --warn

      - name: Freestyle — código sin que las skills de dev hayan registrado activación (warning)
        continue-on-error: true
        run: |
          CODE=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- \
            'src/**' 'app/**' 'lib/**' '*.py' '*.ts' '*.tsx' '*.js' ':!spec/**' ':!docs/**' ':!.github/**' ':!*.md' | wc -l)
          if [ "$CODE" -eq 0 ]; then echo "sin código en el PR"; exit 0; fi
          DEV_ROLES="backend-dev-tdd|frontend-dev-tdd|qa-automation"
          ACT=$(grep -hE "$DEV_ROLES" spec/metrics/usage.jsonl 2>/dev/null | wc -l)
          if [ "$ACT" -eq 0 ]; then
            echo "::warning::$CODE archivo(s) de código en el PR pero ninguna activación registrada de roles dev ($DEV_ROLES) — posible trabajo freestyle"
          else
            echo "OK: $ACT activación(es) dev registradas"
          fi

  dashboard-freshness:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: dashboard-freshness
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Regenerar dashboard solo si hay drift real
        run: |
          # --check compara la huella embebida (ignora el timestamp de generación):
          # sin drift no se toca el archivo y no hay commit vacío por cada push.
          if python3 .claude/skills/sdlc-orchestrator/scripts/harness_graph.py --proyecto . --check; then
            echo "dashboard fresco — nada que hacer"; exit 0
          fi
          python3 .claude/skills/sdlc-orchestrator/scripts/harness_graph.py --proyecto .
          git config user.name "harness-bot"
          git config user.email "harness-bot@users.noreply.github.com"
          git add spec/dashboard.html
          git commit -m "chore: dashboard regenerado [skip ci]"
          git push
