<!DOCTYPE html><html lang='es'><head><meta charset='utf-8'><title>Mapa de capacidades BIAN — Banca de pagos</title><style>:root{--bg:#0b1220;--fg:#e2e8f0;--txt:#f1f5f9;--muted:#64748b;--sub:#8ea0b8;--edge:#94a3b8;--edge-label:#a5b4c9;--chip-bg:#0b1220;--chip-bd:#1e293b;--panel-bg:#0f172a;--panel-bd:#1e293b;--life:#334155;--act-bg:#1e293b;--act-bd:#475569;--seq-msg:#cbd5e1;--seq-ret:#64748b;--shadow:rgba(0,0,0,.35)}:root[data-theme=claro]{--bg:#eef2f7;--fg:#1e293b;--txt:#0f172a;--muted:#64748b;--sub:#5b6b80;--edge:#64748b;--edge-label:#475569;--chip-bg:#ffffff;--chip-bd:#cbd5e1;--panel-bg:#ffffff;--panel-bd:#e2e8f0;--life:#cbd5e1;--act-bg:#e2e8f0;--act-bd:#94a3b8;--seq-msg:#334155;--seq-ret:#94a3b8;--shadow:rgba(15,23,42,.10)}body{background:var(--bg);margin:0;padding:2.2rem;font-family:system-ui;color:var(--fg)}svg{width:100%;max-width:1180px;height:auto;display:block;margin:0 auto}.node,.edge,.chip,.hull,.msg,.life,.act{transition:opacity .18s}.insights{display:flex;gap:1rem;max-width:1180px;margin:1.2rem auto 0;flex-wrap:wrap}.ins{flex:1;min-width:250px;background:var(--panel-bg);border:1px solid var(--panel-bd);border-radius:12px;padding:1rem 1.2rem}.ins b{display:flex;align-items:center;gap:.5rem;font-size:13.5px;color:var(--txt)}.ins .dot{width:9px;height:9px;border-radius:50%;flex:none}.ins ul{margin:.55rem 0 0;padding-left:1.1rem;font-size:12.5px;color:var(--sub);line-height:1.45}.ins li{margin:.28rem 0}#det{display:none;position:fixed;left:2rem;bottom:2rem;max-width:360px;background:var(--panel-bg);border:1px solid var(--panel-bd);border-radius:12px;padding:1rem 1.2rem;box-shadow:0 8px 30px var(--shadow);z-index:9}#toolbar{position:fixed;top:1rem;right:1rem;display:flex;gap:.35rem;z-index:10}#toolbar button{background:var(--panel-bg);border:1px solid var(--panel-bd);color:var(--fg);border-radius:8px;padding:.28rem .55rem;cursor:pointer;font-size:12.5px;font-weight:650}#toolbar button:hover{border-color:var(--edge)}</style></head><body><div id='toolbar'><butt dow)"/><rect class="card" x="60" y="135" width="210" height="68" rx="12" fill="#a78bfa14" stroke="#a78bfa" stroke-width="1.4"/><circle cx="82" cy="159" r="11" fill="#a78bfa26" stroke="#a78bfa99"/><text x="82" y="163.5" fill="#a78bfa" font-size="11" text-anchor="middle">⟨⟩</text><text x="102" y="164" style="fill:var(--txt)" font-size="14.0" font-weight="650">Payment Initiation</text><text x="102" y="185" style="fill:var(--sub)" font-size="11.5">BIAN: Payment Order</text><g class="ebadge"><rect x="218" y="195" width="48" height="16" rx="8" style="fill:var(--chip-bg)" stroke="#34d399" stroke-width="0.9"/><circle cx="226" cy="203" r="3" fill="#34d399"/><text x="244" y="206.4" font-size="9" text-anchor="middle" style="fill:var(--sub)">adoptar</text></g></g><g class="node" data-id="cap-liq" data-tipo="service" style="cursor:pointer"><rect x="62" y="301" width="210" height="68" rx="12" style="fill:var(--shadow)"/><rect class="card" x="60" y="298" width="210" height="68" rx="12" fill="#a78bfa14" stroke="#a78bfa" stroke-width="1.4"/><circle cx="82" cy="322" r="11" fill="#a78bfa26" stroke="#a78bfa99"/><text x="82" y="326.5" fill="#a78bfa" font-size="11" text-anchor="middle">⟨⟩</text><text x="102" y="327" style="fill:var(--txt)" font-size="14.0" font-weight="650">Settlement &amp; Clearing</text><text x="102" y="348" style="fill:var(--sub)" font-size="11.5">BIAN: Payment Clearing</text><g class="ebadge"><rect x="210" y="358" width="55" height="16" rx="8" style="fill:var(--chip-bg)" stroke="#38bdf8" stroke-width="0.9"/><circle cx="218" cy="366" r="3" fill="#38bdf8"/><text x="241" y="369.4" font-size="9" text-anchor="middle" style="fill:var(--sub)">mantener</text></g></g><g class="node" data-id="cap-onb" data-tipo="service" style="cursor:pointer"><rect x="392" y="138" width="210" height="68" rx="12" style="fill:var(--shadow)"/><rect class="card" x="390" y="135" width="210" height="68" rx="12" fill="#a78bfa14" stroke="#a78bfa" stroke-width="1.4"/><circle cx="412" cy="159" r="11" fill="#a78bfa26" stroke="#a78bfa99"/><text x="412" y="163.5" fill="#a78bfa" font-size="11" text-anchor="middle">⟨⟩</text><text x="432" y="164" style="fill:var(--txt)" font-size="14.0" font-weight="650">Merchant Onboarding</text><text x="432" y="185" style="fill:var(--sub)" font-size="11.5">BIAN: Customer Agreement</text><g class="ebadge"><rect x="545" y="195" width="50" height="16" rx="8" style="fill:var(--chip-bg)" stroke="#fbbf24" stroke-width="0.9"/><circle cx="553" cy="203" r="3" fill="#fbbf24"/><text x="573" y="206.4" font-size="9" text-anchor="middle" style="fill:var(--sub)">madurar</text></g></g><g class="node" data-id="cap-crm" data-tipo="service" style="cursor:pointer"><rect x="392" y="301" width="210" height="68" rx="12" style="fill:var(--shadow)"/><rect class="card" x="390" y="298" width="210" height="68" rx="12" fill="#a78bfa14" stroke="#a78bfa" stroke-width="1.4"/><circle cx="412" cy="322" r="11" fill="#a78bfa26" stroke="#a78bfa99"/><text x="412" y="326.5" fill="#a78bfa" font-size="11" text-anchor="middle">⟨⟩</text><text x="432" y="327" style="fill:var(--txt)" font-size="14.0" font-weight="650">Customer 360</text><text x="432" y="348" style="fill:var(--sub)" font-size="11.5">BIAN: Party Reference</text><g class="ebadge"><rect x="549" y="358" width="46" height="16" rx="8" style="fill:var(--chip-bg)" stroke="#fb7185" stroke-width="0.9"/><circle cx="557" cy="366" r="3" fill="#fb7185"/><text x="575" y="369.4" font-size="9" text-anchor="middle" style="fill:var(--sub)">retirar</text></g></g><g class="node" data-id="cap-frd" data-tipo="service" style="cursor:pointer"><rect x="722" y="138" width="210" height="68" rx="12" style="fill:var(--shadow)"/><rect class="card" x="720" y="135" width="210" height="68" rx="12" fill="#a78bfa14" stroke="#a78bfa" stroke-width="1.4"/><circle cx="742" cy="159" r="11" fill="#a78bfa26" stroke="#a78bfa99"/><text x="742" y="163.5" fill="#a78bfa" font-size="11" text-anchor="middle">⟨⟩</text><text x="762" y="164" style="fill:var(--txt)" font-size="14.0" font-weight="650">Fraud Detection</text><text x="762" y="185" style="fill:var(--sub)" font-size="11.5">BIAN: Fraud Diagnosis</text><g class="ebadge"><rect x="878" y="195" width="48" height="16" rx="8" style="fill:var(--chip-bg)" stroke="#34d399" stroke-width="0.9"/><circle cx="886" cy="203" r="3" fill="#34d399"/><text x="904" y="206.4" font-size="9" text-anchor="middle" style="fill:var(--sub)">adoptar</text></g></g><g class="node" data-id="cap-aml" data-tipo="service" style="cursor:pointer"><rect x="722" y="301" width="210" height="68" rx="12" style="fill:var(--shadow)"/><rect class="card" x="720" y="298" width="210" height="68" rx="12" fill="#a78bfa14" stroke="#a78bfa" stroke-width="1.4"/><circle cx="742" cy="322" r="11" fill="#a78bfa26" stroke="#a78bfa99"/><text x="742" y="326.5" fill="#a78bfa" font-size="11" text-anchor="middle">⟨⟩</text><text x="762" y="327" style="fill:var(--txt)" font-size="14.0" font-weight="650">AML Screening</text><text x="762" y="348" style="fill:var(--sub)" font-size="11.5">BIAN: Regulatory Compliance</text><g class="ebadge"><rect x="870" y="358" width="55" height="16" rx="8" style="fill:var(--chip-bg)" stroke="#38bdf8" stroke-width="0.9"/><circle cx="878" cy="366" r="3" fill="#38bdf8"/><text x="901" y="369.4" font-size="9" text-anchor="middle" style="fill:var(--sub)">mantener</text></g></g><g class="chip" data-tipo="service" style="cursor:pointer"><rect x="828" y="58" width="15" height="15" rx="5" fill="#a78bfa26" stroke="#a78bfa"/><text x="849" y="70" style="fill:var(--sub)" font-size="11.5">service 6</text></g></svg><div class="insights"><div class="ins"><b><span class="dot" style="background:#34d399"></span>Apuesta de inversion</b><ul><li>adoptar: Payment Initiation y Fraud Detection (diferenciadores)</li><li>madurar: Merchant Onboarding hasta KYB digital completo</li></ul></div><div class="ins"><b><span class="dot" style="background:#fb7185"></span>Deuda por retirar</b><ul><li>Customer 360 legado: plan de retiro con migracion de datos</li><li>Sin capacidades &#x27;retirar&#x27; en Payments ni Risk</li></ul></div></div></div><div id='det'></div><script>
(function(){
  const root=document.documentElement;
  let tema=localStorage.getItem('dir-tema')||""||(matchMedia('(prefers-color-scheme: light)').matches?'claro':'oscuro');
  let z=parseFloat(localStorage.getItem('dir-zoom')||'1');
  function aplTema(){root.dataset.theme=tema;
    document.getElementById('btn-tema').textContent=tema==='claro'?'🌙':'☀️';
    localStorage.setItem('dir-tema',tema);}
  function aplZoom(){document.getElementById('stage').style.zoom=z;localStorage.setItem('dir-zoom',z);}
  document.getElementById('btn-tema').onclick=ev=>{ev.stopPropagation();tema=tema==='claro'?'oscuro':'claro';aplTema();};
  document.getElementById('btn-zmas').onclick=ev=>{ev.stopPropagation();z=Math.min(1.8,+(z+0.1).toFixed(2));aplZoom();};
  document.getElementById('btn-zmenos').onclick=ev=>{ev.stopPropagation();z=Math.max(0.6,+(z-0.1).toFixed(2));aplZoom();};
  document.getElementById('btn-zreset').onclick=ev=>{ev.stopPropagation();z=1;aplZoom();};
  window.addEventListener('message',ev=>{const d=ev.data||{};
    if(d.portal==='tema'){tema=d.tema==='claro'?'claro':'oscuro';aplTema();}});
  aplTema();aplZoom();
})();

const DATOS={"cap-init": {"titulo": "Payment Initiation", "sub": "BIAN: Payment Order", "tipo": "service", "grupo": "Payments", "detalle": "Ordenes de pago API-first; diferenciador frente a competidores.", "ubicacion": "", "estado": "adoptar", "ir": ""}, "cap-liq": {"titulo": "Settlement & Clearing", "sub": "BIAN: Payment Clearing", "tipo": "service", "grupo": "Payments", "detalle": "Batch hacia el core; suficiente para el volumen actual.", "ubicacion": "", "estado": "mantener", "ir": ""}, "cap-onb": {"titulo": "Merchant Onboarding", "sub": "BIAN: Customer Agreement", "tipo": "service", "grupo": "Customer Management", "detalle": "Alta de comercios semiautomatica; falta KYB digital completo.", "ubicacion": "", "estado": "madurar", "ir": ""}, "cap-crm": {"titulo": "Customer 360", "sub": "BIAN: Party Reference", "tipo": "service", "grupo": "Customer Management", "detalle": "CRM legado a desmantelar; sus datos migran al onboarding nuevo.", "ubicacion": "", "estado": "retirar", "ir": ""}, "cap-frd": {"titulo": "Fraud Detection", "sub": "BIAN: Fraud Diagnosis", "tipo": "service", "grupo": "Risk & Compliance", "detalle": "Scoring en tiempo real; inversion priorizada este ano.", "ubicacion": "", "estado": "adoptar", "ir": ""}, "cap-aml": {"titulo": "AML Screening", "sub": "BIAN: Regulatory Compliance", "tipo": "service", "grupo": "Risk & Compliance", "detalle": "Listas OFAC/ONU automatizadas; revision manual de alertas.", "ubicacion": "", "estado": "mantener", "ir": ""}}, RELS={}, COLORES={"ui": "#38bdf8", "edge": "#2dd4bf", "service": "#a78bfa", "security": "#f59e0b", "db": "#34d399", "job": "#94a3b8", "decision": "#f472b6", "terminal": "#e2e8f0", "source": "#38bdf8", "transform": "#a78bfa", "store": "#34d399", "consumer": "#fbbf24", "start": "#2dd4bf", "waiting": "#fbbf24", "failure": "#fb7185", "actor": "#fbbf24", "external": "#94a3b8", "entity": "#34d399", "role": "#fbbf24", "proceso": "#a78bfa"};
let lens=[];
function aplicar(focus){
  const act=new Set(lens);
  document.querySelectorAll('.node').forEach(g=>{
    const id=g.dataset.id, t=g.dataset.tipo; let dim=false;
    if(act.size) dim=!act.has(t);
    if(focus) dim=!(id===focus||(RELS[focus]||[]).some(r=>r[1]===id));
    g.style.opacity=dim?.12:1;
    const card=g.querySelector('.card'); if(card) card.setAttribute('stroke-width', id===focus?2.6:1.4);
  });
  document.querySelectorAll('.edge').forEach(g=>{
    let dim=false;
    if(focus) dim=!(g.dataset.f===focus||g.dataset.t===focus);
    if(act.size&&!focus){const a=document.querySelector(`.node[data-id="${g.dataset.f}"]`).dataset.tipo,
      b=document.querySelector(`.node[data-id="${g.dataset.t}"]`).dataset.tipo; dim=!(act.has(a)&&act.has(b));}
    g.style.opacity=dim?.08:1;
  });
  document.querySelectorAll('.chip').forEach(c=>{
    c.style.opacity=(act.size&&!act.has(c.dataset.tipo))?.4:1;
    c.querySelector('rect').setAttribute('stroke-width', act.has(c.dataset.tipo)?2.4:1);
  });
  document.querySelectorAll('.hull').forEach(h=>h.style.opacity=focus?.25:.9);
}
function panel(id){
  const p=document.getElementById('det'), d=DATOS[id];
  if(!id){p.style.display='none';return;}
  const rel=(RELS[id]||[]).map(r=>`<li>${r[0]} <b>${DATOS[r[1]].titulo}</b> <span style="color:var(--muted)">· ${r[2]}</span></li>`).join('');
  p.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center">
    <b style="color:${COLORES[d.tipo]}">${d.titulo}</b>
    <span style="cursor:pointer;color:var(--muted)" onclick="foco(null)">✕</span></div>
    <div style="color:var(--sub);font-size:12px;margin:.2rem 0">${d.sub} — ${d.grupo||''} · tipo ${d.tipo}${d.ubicacion?' · 📍 '+d.ubicacion:''}${d.estado?' · '+d.estado:''}</div>
    <div style="font-size:12.5px;margin:.4rem 0">${d.detalle||''}</div>
    ${d.ir?`<div style="font-size:12px;margin:.2rem 0"><a href="${d.ir.replace('.ir.json','.html')}" style="color:#38bdf8">↗ abrir vista de detalle (${d.ir})</a></div>`:''}
    <ul style="margin:.3rem 0 0;padding-left:1.1rem;font-size:12px;color:var(--fg)">${rel}</ul>`;
  p.style.display='block';
}
function foco(id){ window._f=id; aplicar(id); panel(id);
  history.replaceState(null,'',id?'#focus='+id:location.pathname); }
document.querySelectorAll('.node').forEach(g=>g.addEventListener('click',ev=>{
  ev.stopPropagation(); foco(window._f===g.dataset.id?null:g.dataset.id);}));
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  const t=c.dataset.tipo, i=lens.indexOf(t);
  if(i>=0) lens.splice(i,1); else { lens.push(t); if(lens.length>2) lens.shift(); }
  aplicar(window._f);
  history.replaceState(null,'',lens.length?'#lens='+lens.join('~'):location.pathname);}));
document.body.addEventListener('click',()=>foco(null));
const h=location.hash;
if(h.startsWith('#focus=')) foco(h.slice(7));
if(h.startsWith('#lens=')){ lens=h.slice(6).split('~'); aplicar(null); }
</script></body></html>
