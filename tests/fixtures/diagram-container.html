ton id='btn-tema' title='Tema claro/oscuro'>☀</button><button id='btn-zmenos' title='Reducir tamano de fuente'>A−</button><button id='btn-zreset' title='Tamano original'>A</button><button id='btn-zmas' title='Aumentar tamano de fuente'>A+</button></div><div id='stage'><svg viewBox="0 0 1320 426" xmlns="http://www.w3.org/2000/svg" font-family="system-ui"><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.5 L9.5,5 L0.5,9.5 z" style="fill:var(--edge)"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.5 L9.5,5 L0.5,9.5 z" fill="#f472b6"/></marker></defs><text x="60" y="48" style="fill:var(--txt)" font-size="23" font-weight="700">Contenedores (C4 L2) — Plataforma de Pagos</text><text x="60" y="70" style="fill:var(--muted)" font-size="12">derivado de spec/diagrams/contenedores.ir.json · no editar a mano · clic en un elemento para su detalle</text><g class="hull"><rect x="34" y="89" width="592" height="140" rx="14" fill="#38bdf808" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 5" opacity=".85"/><text x="50" y="113" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="2">BOUNDARY: CANAL WEB</text></g><g class="hull"><rect x="694" y="89" width="262" height="303" rx="14" fill="#a78bfa08" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="6 5" opacity=".85"/><text x="710" y="113" fill="#a78bfa" font-size="11" font-weight="700" letter-spacing="2">BOUNDARY: VPC PAG…</text></g><g class="hull"><rect x="1024" y="89" width="262" height="303" rx="14" fill="#34d39908" stroke="#34d399" stroke-width="1.2" stroke-dasharray="6 5" opacity=".85"/><text x="1040" y="113" fill="#34d399" font-size="11" font-weight="700" letter-spacing="2">BOUNDARY: DATOS</text></g><g class="edge" data-f="spa" data-t="bff"><path d="M270,169.0 L390,169.0" fill="none" style="stroke:var(--edge)" stroke- id="api" data-tipo="service" style="cursor:pointer"><rect x="722" y="138" width="210" height="68" rx="12" style="fill:var(--shadow)"/><rect class="card" x="720" y="135" width="210" height="68" rx="12" fill="#a78bfa14" stroke="#a78bfa" stroke-width="1.4"/><circle cx="742" cy="159" r="11" fill="#a78bfa26" stroke="#a78bfa99"/><text x="742" y="163.5" fill="#a78bfa" font-size="11" text-anchor="middle">⟨⟩</text><text x="762" y="164" style="fill:var(--txt)" font-size="14.0" font-weight="650">API de pagos</text><text x="762" y="185" style="fill:var(--sub)" font-size="11.5">FastAPI</text><g class="ubadge"><rect x="851" y="127" width="74" height="16" rx="8" style="fill:var(--chip-bg)" stroke="#a78bfa" stroke-width="0.9"/><text x="888" y="138.4" font-size="9" text-anchor="middle" style="fill:var(--sub)">☁ AWS (cloud)</text></g></g><g class="node" data-id="liq" data-tipo="job" style="cursor:pointer"><rect x="722" y="301" width="210" height="68" rx="12" style="fill:var(--shadow)"/><rect class="card" x="720" y="298" width="210" height="68" rx="12" fill="#94a3b814" stroke="#94a3b8" stroke-width="1.4"/><circle cx="742" cy="322" r="11" fill="#94a3b826" stroke="#94a3b899"/><text x="742" y="326.5" fill="#94a3b8" font-size="11" text-anchor="middle">⚙</text><text x="762" y="327" style="fill:var(--txt)" font-size="14.0" font-weight="650">Worker liquidacion</text><text x="762" y="348" style="fill:var(--sub)" font-size="11.5">job nocturno</text><g class="ubadge"><rect x="851" y="290" width="74" height="16" rx="8" style="fill:var(--chip-bg)" stroke="#94a3b8" stroke-width="0.9"/><text x="888" y="301.4" font-size="9" text-anchor="middle" style="fill:var(--sub)">☁ AWS (cloud)</text></g></g><g class="node" data-id="pg" data-tipo="db" style="cursor:pointer"><rect x="1052" y="138" width="210" height="68" rx="12" style="fill:var(--shadow)"/><rect class="card" x="1050" y="135" width="210" height="68" rx="12" fill="#34d39914" stroke="#34d399" stroke-width="1.4"/><circle cx="1072" cy="159" r="11" fill="#34d39926" stroke="#34d39999"/><text x="1072" y="163.5" fill="#34d399" font-size="11" text-anchor="middle">⛁</text><text x="1092" y="164" style="fill:var(--txt)" font-size="14.0" font-weight="650">PostgreSQL</text><text x="1092" y="185" style="fill:var(--sub)" font-size="11.5">transaccional</text><g class="ubadge"><rect x="1162" y="127" width="93" height="16" rx="8" style="fill:var(--chip-bg)" stroke="#34d399" stroke-width="0.9"/><text x="1209" y="138.4" font-size="9" text-anchor="middle" style="fill:var(--sub)">☁ AWS RDS (cloud)</text></g></g><g class="node" data-id="bus" data-tipo="service" style="cursor:pointer"><rect x="1052" y="301" width="210" height="68" rx="12" style="fill:var(--shadow)"/><rect class="card" x="1050" y="298" width="210" height="68" rx="12" fill="#a78bfa14" stroke="#a78bfa" stroke-width="1.4"/><circle cx="1072" cy="322" r="11" fill="#a78bfa26" stroke="#a78bfa99"/><text x="1072" y="326.5" fill="#a78bfa" font-size="11" text-anchor="middle">⟨⟩</text><text x="1092" y="327" style="fill:var(--txt)" font-size="14.0" font-weight="650">Bus de eventos</text><text x="1092" y="348" style="fill:var(--sub)" font-size="11.5">SNS/SQS</text><g class="ubadge"><rect x="1181" y="290" width="74" height="16" rx="8" style="fill:var(--chip-bg)" stroke="#a78bfa" stroke-width="0.9"/><text x="1218" y="301.4" font-size="9" text-anchor="middle" style="fill:var(--sub)">☁ AWS (cloud)</text></g></g><g class="chip" data-tipo="ui" style="cursor:pointer"><rect x="774" y="58" width="15" height="15" rx="5" fill="#38bdf826" stroke="#38bdf8"/><text x="795" y="70" style="fill:var(--sub)" font-size="11.5">ui 1</text></g><g class="chip" data-tipo="edge" style="cursor:pointer"><rect x="870" y="58" width="15" height="15" rx="5" fill="#2dd4bf26" stroke="#2dd4bf"/><text x="891" y="70" style="fill:var(--sub)" font-size="11.5">edge 1</text></g><g class="chip" data-tipo="service" style="cursor:pointer"><rect x="966" y="58" width="15" height="15" rx="5" fill="#a78bfa26" stroke="#a78bfa"/><text x="987" y="70" style="fill:var(--sub)" font-size="11.5">service 2</text></g><g class="chip" data-tipo="job" style="cursor:pointer"><rect x="1062" y="58" width="15" height="15" rx="5" fill="#94a3b826" stroke="#94a3b8"/><text x="1083" y="70" style="fill:var(--sub)" font-size="11.5">job 1</text></g><g class="chip" data-tipo="db" style="cursor:pointer"><rect x="1158" y="58" width="15" height="15" rx="5" fill="#34d39926" stroke="#34d399"/><text x="1179" y="70" style="fill:var(--sub)" font-size="11.5">db 1</text></g></svg><div class="insights"><div class="ins"><b><span class="dot" style="background:#38bdf8"></span>Boundaries</b><ul><li>Cada contenedor cae dentro de un boundary (regla de validate)</li><li>El boundary de datos nunca se expone fuera de la VPC</li></ul></div><div class="ins"><b><span class="dot" style="background:#34d399"></span>Ubicaciones exigibles</b><ul><li>Todo contenedor declara donde corre (pill de ubicacion)</li><li>Canal web en Cloudflare+AWS; nucleo 100% dentro de la VPC</li></ul></div></div></div><div id='det'></div><script>
(function(){
  const root=document.documentElement;
  let tema=localStorage.getItem('dir-tema')||""||(matchMedia('(prefers-color-scheme: light)').matches?'claro':'oscuro');
  let z=parseFloat(localStorage.getItem('dir-zoom')||'1');
  function aplTema(){root.dataset.theme=tema;
    document.getElementById('btn-tema').textContent=tema==='claro'?'🌙':'☀️';
    localStorage.setItem('dir-tema',tema);}
  function aplZoom(){document.getElementById('stage').style.zoom=z;localStorage.setItem('dir-zoom',z);}
  document.getElementById('btn-tema').onclick=ev=>{ev.stopPropagation();tema=tema==='claro'?'oscuro':'claro';aplTema();};
  document.getElementById('btn-zmas').onclick=ev=>{ev.stopPropagation();z=Math.min(1.8,+(z+0.1).toFixed(2));aplZoom();};
  document.getElementById('btn-zmenos').onclick=ev=>{ev.stopPropagation();z=Math.max(0.6,+(z-0.1).toFixed(2));aplZoom();};
  document.getElementById('btn-zreset').onclick=ev=>{ev.stopPropagation();z=1;aplZoom();};
  window.addEventListener('message',ev=>{const d=ev.data||{};
    if(d.portal==='tema'){tema=d.tema==='claro'?'claro':'oscuro';aplTema();}});
  aplTema();aplZoom();
})();

const DATOS={"spa": {"titulo": "SPA comercios", "sub": "React", "tipo": "ui", "grupo": "Boundary: Canal web", "detalle": "Portal del comercio: ventas, liquidaciones y disputas.", "ubicacion": "Cloudflare (cloud)", "estado": "", "ir": ""}, "bff": {"titulo": "BFF web", "sub": "Node.js", "tipo": "edge", "grupo": "Boundary: Canal web", "detalle": "Agrega y adapta APIs para la SPA; sesiones y tokens.", "ubicacion": "AWS (cloud)", "estado": "", "ir": ""}, "api": {"titulo": "API de pagos", "sub": "FastAPI", "tipo": "service", "grupo": "Boundary: VPC pagos (AWS)", "detalle": "Autorizacion y captura; publica eventos de dominio.", "ubicacion": "AWS (cloud)", "estado": "", "ir": ""}, "liq": {"titulo": "Worker liquidacion", "sub": "job nocturno", "tipo": "job", "grupo": "Boundary: VPC pagos (AWS)", "detalle": "Genera archivos de liquidacion hacia el core bancario.", "ubicacion": "AWS (cloud)", "estado": "", "ir": ""}, "pg": {"titulo": "PostgreSQL", "sub": "transaccional", "tipo": "db", "grupo": "Boundary: Datos", "detalle": "Pagos, comercios y liquidaciones; cifrado en reposo.", "ubicacion": "AWS RDS (cloud)", "estado": "", "ir": ""}, "bus": {"titulo": "Bus de eventos", "sub": "SNS/SQS", "tipo": "service", "grupo": "Boundary: Datos", "detalle": "Eventos de dominio: pago_autorizado, liquidacion_emitida.", "ubicacion": "AWS (cloud)", "estado": "", "ir": ""}}, RELS={"spa": [["→", "bff", "HTTPS/JSON"]], "bff": [["←", "spa", "HTTPS/JSON"], ["→", "api", "REST + JWT"]], "api": [["←", "bff", "REST + JWT"], ["→", "pg", "SQL (TLS)"], ["→", "bus", "publica eventos"]], "pg": [["←", "api", "SQL (TLS)"], ["←", "liq", "lee pagos"]], "bus": [["←", "api", "publica eventos"], ["←", "liq", "consume"]], "liq": [["→", "bus", "consume"], ["→", "pg", "lee pagos"]]}, COLORES={"ui": "#38bdf8", "edge": "#2dd4bf", "service": "#a78bfa", "security": "#f59e0b", "db": "#34d399", "job": "#94a3b8", "decision": "#f472b6", "terminal": "#e2e8f0", "source": "#38bdf8", "transform": "#a78bfa", "store": "#34d399", "consumer": "#fbbf24", "start": "#2dd4bf", "waiting": "#fbbf24", "failure": "#fb7185", "actor": "#fbbf24", "external": "#94a3b8", "entity": "#34d399", "role": "#fbbf24", "proceso": "#a78bfa"};
let lens=[];
function aplicar(focus){
  const act=new Set(lens);
  document.querySelectorAll('.node').forEach(g=>{
    const id=g.dataset.id, t=g.dataset.tipo; let dim=false;
    if(act.size) dim=!act.has(t);
    if(focus) dim=!(id===focus||(RELS[focus]||[]).some(r=>r[1]===id));
    g.style.opacity=dim?.12:1;
    const card=g.querySelector('.card'); if(card) card.setAttribute('stroke-width', id===focus?2.6:1.4);
  });
  document.querySelectorAll('.edge').forEach(g=>{
    let dim=false;
    if(focus) dim=!(g.dataset.f===focus||g.dataset.t===focus);
    if(act.size&&!focus){const a=document.querySelector(`.node[data-id="${g.dataset.f}"]`).dataset.tipo,
      b=document.querySelector(`.node[data-id="${g.dataset.t}"]`).dataset.tipo; dim=!(act.has(a)&&act.has(b));}
    g.style.opacity=dim?.08:1;
  });
  document.querySelectorAll('.chip').forEach(c=>{
    c.style.opacity=(act.size&&!act.has(c.dataset.tipo))?.4:1;
    c.querySelector('rect').setAttribute('stroke-width', act.has(c.dataset.tipo)?2.4:1);
  });
  document.querySelectorAll('.hull').forEach(h=>h.style.opacity=focus?.25:.9);
}
function panel(id){
  const p=document.getElementById('det'), d=DATOS[id];
  if(!id){p.style.display='none';return;}
  const rel=(RELS[id]||[]).map(r=>`<li>${r[0]} <b>${DATOS[r[1]].titulo}</b> <span style="color:var(--muted)">· ${r[2]}</span></li>`).join('');
  p.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center">
    <b style="color:${COLORES[d.tipo]}">${d.titulo}</b>
    <span style="cursor:pointer;color:var(--muted)" onclick="foco(null)">✕</span></div>
    <div style="color:var(--sub);font-size:12px;margin:.2rem 0">${d.sub} — ${d.grupo||''} · tipo ${d.tipo}${d.ubicacion?' · 📍 '+d.ubicacion:''}${d.estado?' · '+d.estado:''}</div>
    <div style="font-size:12.5px;margin:.4rem 0">${d.detalle||''}</div>
    ${d.ir?`<div style="font-size:12px;margin:.2rem 0"><a href="${d.ir.replace('.ir.json','.html')}" style="color:#38bdf8">↗ abrir vista de detalle (${d.ir})</a></div>`:''}
    <ul style="margin:.3rem 0 0;padding-left:1.1rem;font-size:12px;color:var(--fg)">${rel}</ul>`;
  p.style.display='block';
}
function foco(id){ window._f=id; aplicar(id); panel(id);
  history.replaceState(null,'',id?'#focus='+id:location.pathname); }
document.querySelectorAll('.node').forEach(g=>g.addEventListener('click',ev=>{
  ev.stopPropagation(); foco(window._f===g.dataset.id?null:g.dataset.id);}));
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  const t=c.dataset.tipo, i=lens.indexOf(t);
  if(i>=0) lens.splice(i,1); else { lens.push(t); if(lens.length>2) lens.shift(); }
  aplicar(window._f);
  history.replaceState(null,'',lens.length?'#lens='+lens.join('~'):location.pathname);}));
document.body.addEventListener('click',()=>foco(null));
const h=location.hash;
if(h.startsWith('#focus=')) foco(h.slice(7));
if(h.startsWith('#lens=')){ lens=h.slice(6).split('~'); aplicar(null); }
</script></body></html>
