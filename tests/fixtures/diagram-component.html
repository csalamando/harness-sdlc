<!DOCTYPE html><html lang='es'><head><meta charset='utf-8'><title>Componentes (C4 L3) — API de pagos</title><style>:root{--bg:#0b1220;--fg:#e2e8f0;--txt:#f1f5f9;--muted:#64748b;--sub:#8ea0b8;--edge:#94a3b8;--edge-label:#a5b4c9;--chip-bg:#0b1220;--chip-bd:#1e293b;--panel-bg:#0f172a;--panel-bd:#1e293b;--life:#334155;--act-bg:#1e293b;--act-bd:#475569;--seq-msg:#cbd5e1;--seq-ret:#64748b;--shadow:rgba(0,0,0,.35)}:root[data-theme=claro]{--bg:#eef2f7;--fg:#1e293b;--txt:#0f172a;--muted:#64748b;--sub:#5b6b80;--edge:#64748b;--edge-label:#475569;--chip-bg:#ffffff;--chip-bd:#cbd5e1;--panel-bg:#ffffff;--panel-bd:#e2e8f0;--life:#cbd5e1;--act-bg:#e2e8f0;--act-bd:#94a3b8;--seq-msg:#334155;--seq-ret:#94a3b8;--shadow:rgba(15,23,42,.10)}body{background:var(--bg);margin:0;padding:2.2rem;font-family:system-ui;color:var(--fg)}svg{width:100%;max-width:1180px;height:auto;display:block;margin:0 auto}.node,.edge,.chip,.hull,.msg,.life,.act{transition:opacity .18s}.insights{display:flex;gap:1rem;max-width:1180px;margin:1.2rem auto 0;flex-wrap:wrap}.ins{flex:1;min-width:250px;background:var(--panel-bg);border:1px solid var(--panel-bd);border-radius:12px;padding:1rem 1.2rem}.ins b{display:flex;align-items:center;gap:.5rem;font-size:13.5px;color:var(--txt)}.ins .dot{width:9px;height:9px;border-radius:50%;flex:none}.ins ul{margin:.55rem 0 0;padding-left:1.1rem;font-size:12.5px;color:var(--sub);line-height:1.45}.ins li{margin:.28rem 0}#det{display:none;position:fixed;left:2rem;bottom:2rem;max-width:360px;background:var(--panel-bg);border:1px solid var(--panel-bd);border-radius:12px;padding:1rem 1.2rem;box-shadow:0 8px 30px var(--shadow);z-index:9}#toolbar{position:fixed;top:1rem;right:1rem;display:flex;gap:.35rem;z-index:10}#toolbar button{background:var(--panel-bg);border:1px solid var(--panel-bd);color:var(--fg);border-radius:8px;padding:.28rem .55rem;cursor:pointer;font-size:12.5px;font-weight:650}#toolbar button:hover{border-color:var(--edge)}</style></head><body><div id='toolbar'><button id='btn-tema' title='Tema claro/oscuro'>☀</button><button id='btn-zmenos' title='Reducir tamano de fuente'>A−</button><button id='btn-zreset' title='Tamano original'>A</button><button id='btn-zmas' title='Aumentar tamano de fuente'>A+</button></div><div id='stage'><svg viewBox="0 0 990 619" xmlns="http://www.w3.org/2000/svg" font-family="system-ui"><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.5 L9.5,5 L0.5,9.5 z" style="fill:var(--edge)"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.5 L9.5,5 L0.5,9.5 z" fill="#f472b6"/></marker></defs><text x="60" y="48" style="fill:var(--txt)" font-size="23" font-weight="700">Componentes (C4 L3) — API de pagos</text><text x="60" y="70" style="fill:var(--muted)" font-size="12">derivado de spec/diagrams/componentes-api.ir.json · no editar a mano · clic en un elemento para su detalle</text><g class="hull"><rect x="34" y="89" width="922" height="466" rx="14" fill="#a78bfa08" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="6 5" opacity=".85"/><text x="50" y="113" fill="#a78bfa" font-size="11" font-weight="700" letter-spacing="2">CONTENEDOR: API DE PAGOS (FASTAPI)</text></g><g class="edge" data-f="router" data-t="uc"><path d="M270,169.0 L390,169.0" fill="none" style="stroke:var(--edge)" stroke-width="1.5" marker-end="url(#arr)"/><rect x="286" y="150.0" width="88" height="18" rx="9" style="fill:var(--chip-bg);stroke:var(--chip-bd)"/><text x="330" y="163.0" style="fill:var(--edge-label)" font-size="10.5" text-anchor="middle">DTO validado</text></g><g class="edge" data-f="uc" data-t="repo"><path d="M600,169.0 L720,169.0" fill="none" style="stroke:var(--edge)" stroke-width="1.5" marker-end="url(#arr)"/><rect x="628" y="150.0" width="64" height="18" rx="9" style="fill:var(--chip-bg);stroke:var(--chip-bd)"/><text x="660" y="163.0" style="fill:var(--edge-label)" font-size="10.5" text-anchor="middle">persiste</text></g><g class="edge" data-f="uc" data-t="fraude"><path d="M600,169.0 L650.0,169.0 Q660.0,169.0 660.0,179.0 L660.0,322.0 Q660.0,332.0 670.0,332.0 L720,332.0" fill="none" style="stroke:var(--edge)" stroke-width="1.5" marker-end="url(#arr)"/><rect x="612" y="231.5" width="96" height="18" rx="9" style="fill:var(--chip-bg);stroke:var(--chip-bd)"/><text x="660" y="244.5" style="fill:var(--edge-label)" font-size="10.5" text-anchor="middle">scoring (REST)</text></g><g class="edge" data-f="bus" data-t="repo"><path d="M720,495.0 L689,495.0 Q698,495.0 698,504.0 L698,558 Q698,567 689,567 L707,567 Q698,567 698,558 L698,178.0 Q698,169.0 707,169.0 L720,169.0" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrb)"/><rect x="787" y="558" width="76" height="18" rx="9" style="fill:var(--chip-bg)" stroke="#f472b655"/><text x="825" y="571" fill="#f9a8d4" font-size="10.5" text-anchor="middle">lee outbox</text></g><g class="node" data-id="router" data-tipo="edge" style="cursor:pointer"><rect x="62" y="138" width="210" height="68" rx="12" style="fill:var(--shadow)"/><rect class="card" x="60" y="135" width="210" height="68" rx="12" fill="#2dd4bf14" stroke="#2dd4bf" stroke-width="1.4"/><circle cx="82" cy="159" r="11" fill="#2dd4bf26" stroke="#2dd4bf99"/><text x="82" y="163.5" fill="#2dd4bf" font-size="11" text-anchor="middle">⇄</text><text x="102" y="164" style="fill:var(--txt)" font-size="14.0" font-weight="650">Router HTTP</text><text x="102" y="185" style="fill:var(--sub)" font-size="11.5">endpoints /pagos</text></g><g class="node" data-id="uc" data-tipo="service" style="cursor:pointer"><rect x="392" y="138" width="210" height="68" rx="12" style="fill:var(--shadow)"/><rect class="card" x="390" y="135" width="210" height="68" rx="12" fill="#a78bfa14" stroke="#a78bfa" stroke-width="1.4"/><circle cx="412" cy="159" r="11" fill="#a78bfa26" stroke="#a78bfa99"/><text x="412" y="163.5" fill="#a78bfa" font-size="11" text-anchor="middle">⟨⟩</text><text x="432" y="164" style="fill:var(--txt)" font-size="14.0" font-weight="650">Casos de uso</text><text x="432" y="185" style="fill:var(--sub)" font-size="11.5">autorizar/capturar</text></g><g class="node" data-id="repo" data-tipo="db" style="cursor:pointer"><rect x="722" y="138" width="210" height="68" rx="12" style="fill:var(--shadow)"/><rect class="card" x="720" y="135" width="210" height="68" rx="12" fill="#34d39914" stroke="#34d399" stroke-width="1.4"/><circle cx="742" cy="159" r="11" fill="#34d39926" stroke="#34d39999"/><text x="742" y="163.5" fill="#34d399" font-size="11" text-anchor="middle">⛁</text><text x="762" y="164" style="fill:var(--txt)" font-size="14.0" font-weight="650">Repositorio pagos</text><text x="762" y="185" style="fill:var(--sub)" font-size="11.5">puerto + adaptador</text></g><g class="node" data-id="bus" data-tipo="job" style="cursor:pointer"><rect x="722" y="464" width="210" height="68" rx="12" style="fill:var(--shadow)"/><rect class="card" x="720" y="461" width="210" height="68" rx="12" fill="#94a3b814" stroke="#94a3b8" stroke-width="1.4"/><circle cx="742" cy="485" r="11" fill="#94a3b826" stroke="#94a3b899"/><text x="742" y="489.5" fill="#94a3b8" font-size="11" text-anchor="middle">⚙</text><text x="762" y="490" style="fill:var(--txt)" font-size="14.0" font-weight="650">Publicador eventos</text><text x="762" y="511" style="fill:var(--sub)" font-size="11.5">outbox → SNS</text></g><g class="node" data-id="fraude" data-tipo="external" style="cursor:pointer"><rect x="722" y="301" width="210" height="68" rx="12" style="fill:var(--shadow)"/><rect class="card" x="720" y="298" width="210" height="68" rx="12" fill="#94a3b814" stroke="#94a3b8" stroke-width="1.4"/><circle cx="742" cy="322" r="11" fill="#94a3b826" stroke="#94a3b899"/><text x="742" y="326.5" fill="#94a3b8" font-size="11" text-anchor="middle">⬡</text><text x="762" y="327" style="fill:var(--txt)" font-size="14.0" font-weight="650">Cliente antifraude</text><text x="762" y="348" style="fill:var(--sub)" font-size="11.5">adapter SaaS</text><g class="drill"><circle cx="914" cy="350" r="9" fill="#94a3b826" stroke="#94a3b8"/><text x="914" y="353.5" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">↗</text></g></g><g class="chip" data-tipo="edge" style="cursor:pointer"><rect x="444" y="58" width="15" height="15" rx="5" fill="#2dd4bf26" stroke="#2dd4bf"/><text x="465" y="70" style="fill:var(--sub)" font-size="11.5">edge 1</text></g><g class="chip" data-tipo="service" style="cursor:pointer"><rect x="540" y="58" width="15" height="15" rx="5" fill="#a78bfa26" stroke="#a78bfa"/><text x="561" y="70" style="fill:var(--sub)" font-size="11.5">service 1</text></g><g class="chip" data-tipo="db" style="cursor:pointer"><rect x="636" y="58" width="15" height="15" rx="5" fill="#34d39926" stroke="#34d399"/><text x="657" y="70" style="fill:var(--sub)" font-size="11.5">db 1</text></g><g class="chip" data-tipo="job" style="cursor:pointer"><rect x="732" y="58" width="15" height="15" rx="5" fill="#94a3b826" stroke="#94a3b8"/><text x="753" y="70" style="fill:var(--sub)" font-size="11.5">job 1</text></g><g class="chip" data-tipo="external" style="cursor:pointer"><rect x="828" y="58" width="15" height="15" rx="5" fill="#94a3b826" stroke="#94a3b8"/><text x="849" y="70" style="fill:var(--sub)" font-size="11.5">external 1</text></g></svg><div class="insights"><div class="ins"><b><span class="dot" style="background:#a78bfa"></span>Arquitectura limpia</b><ul><li>El router no conoce persistencia; los casos de uso no conocen HTTP</li><li>Outbox + publicador: ningun evento se pierde si cae el bus</li></ul></div><div class="ins"><b><span class="dot" style="background:#38bdf8"></span>Drill-down</b><ul><li>El cliente antifraude enlaza (↗) a la vista de despliegue</li><li>El enlace vive en el IR (campo ir) y el panel muestra la ruta</li></ul></div></div></div><div id='det'></div><script>
(function(){
  const root=document.documentElement;
  let tema=localStorage.getItem('dir-tema')||""||(matchMedia('(prefers-color-scheme: light)').matches?'claro':'oscuro');
  let z=parseFloat(localStorage.getItem('dir-zoom')||'1');
  function aplTema(){root.dataset.theme=tema;
    document.getElementById('btn-tema').textContent=tema==='claro'?'🌙':'☀️';
    localStorage.setItem('dir-tema',tema);}
  function aplZoom(){document.getElementById('stage').style.zoom=z;localStorage.setItem('dir-zoom',z);}
  document.getElementById('btn-tema').onclick=ev=>{ev.stopPropagation();tema=tema==='claro'?'oscuro':'claro';aplTema();};
  document.getElementById('btn-zmas').onclick=ev=>{ev.stopPropagation();z=Math.min(1.8,+(z+0.1).toFixed(2));aplZoom();};
  document.getElementById('btn-zmenos').onclick=ev=>{ev.stopPropagation();z=Math.max(0.6,+(z-0.1).toFixed(2));aplZoom();};
  document.getElementById('btn-zreset').onclick=ev=>{ev.stopPropagation();z=1;aplZoom();};
  window.addEventListener('message',ev=>{const d=ev.data||{};
    if(d.portal==='tema'){tema=d.tema==='claro'?'claro':'oscuro';aplTema();}});
  aplTema();aplZoom();
})();

const DATOS={"router": {"titulo": "Router HTTP", "sub": "endpoints /pagos", "tipo": "edge", "grupo": "Contenedor: API de pagos (FastAPI)", "detalle": "Valida esquemas, autentica JWT y enruta a los casos de uso.", "ubicacion": "", "estado": "", "ir": ""}, "uc": {"titulo": "Casos de uso", "sub": "autorizar/capturar", "tipo": "service", "grupo": "Contenedor: API de pagos (FastAPI)", "detalle": "Orquesta la transaccion; sin logica de infraestructura.", "ubicacion": "", "estado": "", "ir": ""}, "repo": {"titulo": "Repositorio pagos", "sub": "puerto + adaptador", "tipo": "db", "grupo": "Contenedor: API de pagos (FastAPI)", "detalle": "Persistencia en PostgreSQL; transaccional con outbox.", "ubicacion": "", "estado": "", "ir": ""}, "bus": {"titulo": "Publicador eventos", "sub": "outbox → SNS", "tipo": "job", "grupo": "Contenedor: API de pagos (FastAPI)", "detalle": "Lee el outbox y publica eventos de dominio.", "ubicacion": "", "estado": "", "ir": ""}, "fraude": {"titulo": "Cliente antifraude", "sub": "adapter SaaS", "tipo": "external", "grupo": "Contenedor: API de pagos (FastAPI)", "detalle": "Adaptador del motor antifraude; ver la vista de despliegue con ↗.", "ubicacion": "", "estado": "", "ir": "diagram-deployment.ir.json"}}, RELS={"router": [["→", "uc", "DTO validado"]], "uc": [["←", "router", "DTO validado"], ["→", "repo", "persiste"], ["→", "fraude", "scoring (REST)"]], "repo": [["←", "uc", "persiste"], ["←", "bus", "lee outbox"]], "fraude": [["←", "uc", "scoring (REST)"]], "bus": [["→", "repo", "lee outbox"]]}, COLORES={"ui": "#38bdf8", "edge": "#2dd4bf", "service": "#a78bfa", "security": "#f59e0b", "db": "#34d399", "job": "#94a3b8", "decision": "#f472b6", "terminal": "#e2e8f0", "source": "#38bdf8", "transform": "#a78bfa", "store": "#34d399", "consumer": "#fbbf24", "start": "#2dd4bf", "waiting": "#fbbf24", "failure": "#fb7185", "actor": "#fbbf24", "external": "#94a3b8", "entity": "#34d399", "role": "#fbbf24", "proceso": "#a78bfa"};
let lens=[];
function aplicar(focus){
  const act=new Set(lens);
  document.querySelectorAll('.node').forEach(g=>{
    const id=g.dataset.id, t=g.dataset.tipo; let dim=false;
    if(act.size) dim=!act.has(t);
    if(focus) dim=!(id===focus||(RELS[focus]||[]).some(r=>r[1]===id));
    g.style.opacity=dim?.12:1;
    const card=g.querySelector('.card'); if(card) card.setAttribute('stroke-width', id===focus?2.6:1.4);
  });
  document.querySelectorAll('.edge').forEach(g=>{
    let dim=false;
    if(focus) dim=!(g.dataset.f===focus||g.dataset.t===focus);
    if(act.size&&!focus){const a=document.querySelector(`.node[data-id="${g.dataset.f}"]`).dataset.tipo,
      b=document.querySelector(`.node[data-id="${g.dataset.t}"]`).dataset.tipo; dim=!(act.has(a)&&act.has(b));}
    g.style.opacity=dim?.08:1;
  });
  document.querySelectorAll('.chip').forEach(c=>{
    c.style.opacity=(act.size&&!act.has(c.dataset.tipo))?.4:1;
    c.querySelector('rect').setAttribute('stroke-width', act.has(c.dataset.tipo)?2.4:1);
  });
  document.querySelectorAll('.hull').forEach(h=>h.style.opacity=focus?.25:.9);
}
function panel(id){
  const p=document.getElementById('det'), d=DATOS[id];
  if(!id){p.style.display='none';return;}
  const rel=(RELS[id]||[]).map(r=>`<li>${r[0]} <b>${DATOS[r[1]].titulo}</b> <span style="color:var(--muted)">· ${r[2]}</span></li>`).join('');
  p.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center">
    <b style="color:${COLORES[d.tipo]}">${d.titulo}</b>
    <span style="cursor:pointer;color:var(--muted)" onclick="foco(null)">✕</span></div>
    <div style="color:var(--sub);font-size:12px;margin:.2rem 0">${d.sub} — ${d.grupo||''} · tipo ${d.tipo}${d.ubicacion?' · 📍 '+d.ubicacion:''}${d.estado?' · '+d.estado:''}</div>
    <div style="font-size:12.5px;margin:.4rem 0">${d.detalle||''}</div>
    ${d.ir?`<div style="font-size:12px;margin:.2rem 0"><a href="${d.ir.replace('.ir.json','.html')}" style="color:#38bdf8">↗ abrir vista de detalle (${d.ir})</a></div>`:''}
    <ul style="margin:.3rem 0 0;padding-left:1.1rem;font-size:12px;color:var(--fg)">${rel}</ul>`;
  p.style.display='block';
}
function foco(id){ window._f=id; aplicar(id); panel(id);
  history.replaceState(null,'',id?'#focus='+id:location.pathname); }
document.querySelectorAll('.node').forEach(g=>g.addEventListener('click',ev=>{
  ev.stopPropagation(); foco(window._f===g.dataset.id?null:g.dataset.id);}));
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  const t=c.dataset.tipo, i=lens.indexOf(t);
  if(i>=0) lens.splice(i,1); else { lens.push(t); if(lens.length>2) lens.shift(); }
  aplicar(window._f);
  history.replaceState(null,'',lens.length?'#lens='+lens.join('~'):location.pathname);}));
document.body.addEventListener('click',()=>foco(null));
const h=location.hash;
if(h.startsWith('#focus=')) foco(h.slice(7));
if(h.startsWith('#lens=')){ lens=h.slice(6).split('~'); aplicar(null); }
</script></body></html>
